name: Build ISS Android APK

on:
workflow_dispatch:

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: android-actions/setup-android@v3

  - uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Extract Android Project
    run: |
      mkdir project
      unzip -q ISS_Construction_Manager_Android_Phone_Build.zip -d project

  - name: Build APK
    run: |
      cd project/ISS_Construction_Manager_Android
      gradle --no-daemon assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: ISS-Construction-Manager-APK
      path: project/ISS_Construction_Manager_Android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
